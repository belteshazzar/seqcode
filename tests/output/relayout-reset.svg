<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="335" height="360" viewBox="0 0 335 360"><defs><linearGradient id="SvgjsLinearGradient1000"><stop stop-color="#eeeeee" offset="0"></stop><stop stop-color="#dddddd" offset="1"></stop></linearGradient><linearGradient x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffda1" offset="0"></stop><stop stop-color="#ffeb5b" offset="1"></stop></linearGradient><text id="seqcode"># Regression: two deferred async signals to the same object, where the first
# body messages an object further right. Layout inserts a Pause via check()
# and re-lays-out, exercising the reset() path (which used to crash on an
# undeclared `refs` variable).
a.f() {
	b &gt; s1() {
		c.x()
	}
	b &gt; s2()
}
